name: unit-test
on: push
jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Install Dependencies
      run: go test ./...
  sast-test:
    name: SAST Test
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go mod download
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Run Gosec Security Scanner
        uses: securego/gosec@v2.22.3
        with:
          args: ./...